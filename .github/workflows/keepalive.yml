name: Keep Render awake

# Free-tier Render services sleep after ~15 min idle. Ping the API health
# endpoint on a schedule so the app stays warm without a laptop running.
on:
  schedule:
    - cron: "*/12 * * * *" # every 12 minutes (< Render's ~15 min idle window)
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL || secrets.RENDER_BACKEND_URL }}
      RENDER_FRONTEND_URL: ${{ vars.RENDER_FRONTEND_URL || secrets.RENDER_FRONTEND_URL }}
    steps:
      # GET, not HEAD: the FastAPI router registers /health for GET only and
      # answers HEAD with 405, which would fail every ping.
      - name: Ping API health
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 -o /dev/null \
            "${RENDER_BACKEND_URL:-https://sterling-api-6u7n.onrender.com/health}" \
            || echo "Render wake-up ping timed out or service is spinning up."

      - name: Ping frontend
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 -o /dev/null \
            "${RENDER_FRONTEND_URL:-https://sterling-web-6u7n.onrender.com}" \
            || echo "Render wake-up ping timed out or service is spinning up."
